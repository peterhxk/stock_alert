# Two services, one image. They are split so a slow notification or a Yahoo
# hiccup in the poller can never block the UI, and restarting the UI can never
# drop the poller.
services:
  web:
    build: .
    restart: unless-stopped
    ports:
      - "${PORT:-8080}:8080"
    env_file: .env
    volumes:
      - alerts-data:/data
    # /healthz is 503 when the poller has stopped reporting, so an unhealthy
    # web container means "alerts are not being checked" - the failure that
    # actually matters - not just "the UI is down".
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8080/healthz')"]
      interval: 60s
      timeout: 10s
      start_period: 120s
      retries: 3

  engine:
    build: .
    restart: unless-stopped
    command: ["python", "-m", "src.engine"]
    env_file: .env
    volumes:
      - alerts-data:/data

volumes:
  alerts-data:
