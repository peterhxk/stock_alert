<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Price Alerts{% endblock %}</title>
<style>
  :root{
    --bg:#fbfbf9; --panel:#fff; --ink:#14140f; --ink2:#5f5e57; --line:#e6e5df;
    --accent:#2a6fd6; --up:#1a7f4b; --down:#c0392b; --warn:#b5760a;
    --chip:#f0efe9;
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#14140f; --panel:#1c1c17; --ink:#f2f1ea; --ink2:#a3a299;
           --line:#2e2e27; --accent:#6aa6f5; --up:#4cc98a; --down:#ef7d6f;
           --warn:#e0a44a; --chip:#26261f; }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
       font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
  .wrap{max-width:1080px;margin:0 auto;padding:28px 20px 64px}
  header{display:flex;align-items:baseline;gap:18px;margin-bottom:6px;flex-wrap:wrap}
  h1{font-size:21px;margin:0;letter-spacing:-.01em}
  nav a{color:var(--ink2);text-decoration:none;margin-right:14px;font-size:14px}
  nav a:hover,nav a.on{color:var(--ink)}
  .sub{color:var(--ink2);font-size:13px;margin:0 0 22px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:10px;
        padding:18px;margin-bottom:20px}
  h2{font-size:13px;text-transform:uppercase;letter-spacing:.06em;
     color:var(--ink2);margin:0 0 14px;font-weight:600}
  table{width:100%;border-collapse:collapse;font-size:14px}
  th{text-align:left;font-weight:600;color:var(--ink2);font-size:12px;
     text-transform:uppercase;letter-spacing:.04em;padding:0 10px 8px;border-bottom:1px solid var(--line)}
  td{padding:11px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
  tr:last-child td{border-bottom:none}
  .num{font-variant-numeric:tabular-nums;text-align:right}
  .tk{font-weight:650;letter-spacing:.02em}
  .muted{color:var(--ink2)}
  .up{color:var(--up)} .down{color:var(--down)}
  .chip{display:inline-block;background:var(--chip);border-radius:5px;
        padding:2px 7px;font-size:11.5px;color:var(--ink2);white-space:nowrap}
  .chip.on{color:var(--up)} .chip.off{color:var(--ink2);opacity:.75}
  form.inline{display:inline}
  button{font:inherit;cursor:pointer;border-radius:7px;border:1px solid var(--line);
         background:var(--panel);color:var(--ink);padding:6px 11px;font-size:13px}
  button:hover{border-color:var(--ink2)}
  button.primary{background:var(--accent);color:#fff;border-color:transparent;
                 padding:9px 18px;font-weight:600}
  button.danger:hover{color:var(--down);border-color:var(--down)}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:13px}
  label{display:block;font-size:12px;color:var(--ink2);margin-bottom:5px;font-weight:500}
  input,select{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:7px;
               background:var(--bg);color:var(--ink);font:inherit;font-size:14px}
  input:focus,select:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:transparent}
  .row-end{display:flex;align-items:flex-end;gap:12px;margin-top:14px;flex-wrap:wrap}
  .check{display:flex;align-items:center;gap:7px;font-size:13px;color:var(--ink2)}
  .check input{width:auto}
  .flash{padding:10px 14px;border-radius:8px;margin-bottom:14px;font-size:14px}
  .flash.ok{background:rgba(26,127,75,.12);color:var(--up)}
  .flash.error{background:rgba(192,57,43,.12);color:var(--down)}
  .banner{background:rgba(181,118,10,.12);color:var(--warn);padding:11px 14px;
          border-radius:8px;font-size:13.5px;margin-bottom:20px}
  .empty{text-align:center;color:var(--ink2);padding:34px 10px;font-size:14px}
  @media(max-width:640px){ .hide-sm{display:none} .wrap{padding:18px 13px 48px} }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Price Alerts</h1>
    <nav>
      <a href="{{ url_for('index') }}" class="{{ 'on' if request.endpoint=='index' }}">Alerts</a>
      <a href="{{ url_for('history') }}" class="{{ 'on' if request.endpoint=='history' }}">History</a>
      {% if config_has_password %}<a href="{{ url_for('logout') }}">Log out</a>{% endif %}
    </nav>
  </header>
  {% block sub %}{% endblock %}
  {% with msgs = get_flashed_messages(with_categories=true) %}
    {% for cat, m in msgs %}<div class="flash {{ cat }}">{{ m }}</div>{% endfor %}
  {% endwith %}
  {% block body %}{% endblock %}
</div>
</body>
</html>
